services:
  postgres:
    image: postgres:16-alpine
    container_name: logistics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_dev
      POSTGRES_DB: logistics
    ports:
      - "5433:5432"
    volumes:
      - logistics-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  logistics-pgdata:
