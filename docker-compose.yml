services:
  postgres:
    image: postgres:16-alpine
    container_name: logistics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_dev
      POSTGRES_DB: logistics
    ports:
      # Loopback only: the dev database has a known password and must not be reachable from the
      # network the laptop happens to be on.
      - "127.0.0.1:5433:5432"
    volumes:
      - logistics-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  logistics-pgdata:
