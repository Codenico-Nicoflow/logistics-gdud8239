services:
  - type: web
    name: logistics-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: npm install --include=dev && npm run generate --workspace=apps/api && npm run build --workspace=apps/api
    startCommand: npm run migrate:deploy --workspace=apps/api && npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: COOKIE_SECURE
        value: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: SNAPSHOT_DIR
        value: ./data/snapshots
      - key: DB_BACKUP_DIR
        value: ./data/db-backups
      # The database OWNER: migrations and pg_dump only.
      - key: DATABASE_URL
        sync: false
      # The restricted role `logistics_app` the API serves requests as, so the database itself keeps
      # battalions apart (row-level security). Same database, different user; see docs/feat-mt-isolation.md.
      - key: APP_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: MESAKEM_SLACK_CHANNEL_ID
        sync: false
      # ימי יציאה: the Thursday 15:00 post and the "send to Slack" button (a channel ID, C…).
      - key: ATTENDANCE_SLACK_CHANNEL_ID
        sync: false
      # Proxy hops in front of the API (Vercel rewrite + Render). Set it from GET /api/auth/debug-ip, see
      # docs/fix-platform-hardening-and-throttling.md. Unset = every visitor looks like one IP.
      - key: TRUST_PROXY_HOPS
        sync: false
